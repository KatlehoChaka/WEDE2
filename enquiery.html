<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitman Plumbing | Get a Quote</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="images/logo.png" alt="Hitman Plumbing Logo">
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Get a Quote</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="tel:+27111234567" class="call-btn">📞 24/7 Call Now</a>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Request a Free Quote</h1>
            <p>Fill in the form below and we will get back to you within 1 hour</p>
        </section>

        <!-- Quote request form -->
        <section class="enquiry-form">
            <form action="#" method="post">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="service">Service Needed:</label>
                <select id="service" name="service">
                    <option value="blocked-drain">Blocked Drain</option>
                    <option value="burst-pipe">Burst Pipe</option>
                    <option value="geyser">Geyser Installation/Repair</option>
                    <option value="toilet-sink">Toilet/Sink Installation</option>
                    <option value="sewer">Sewer Line Maintenance</option>
                    <option value="other">Other Plumbing Repair</option>
                </select>

                <label for="message">Describe the Problem:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="btn">Submit Quote Request</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hitman Plumbing. All rights reserved.</p>
    </footer>
</body>
</html>
