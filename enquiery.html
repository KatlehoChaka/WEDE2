<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request a free plumbing quote from Hitman Plumbing in Randburg.">
    <meta name="keywords" content="plumbing quote Randburg, free plumber quote">
    <title>Get a Free Quote | Hitman Plumbing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav aria-label="Main navigation">
            <div class="logo">
                <a href="index.html" class="logo-text">HITMAN PLUMBING</a>
            </div>
            <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html" class="active">Get a Quote</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="tel:+27111234567" class="call-btn">📞 24/7 Call Now</a>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Request a Free Quote</h1>
            <p>Fill in the form below and we will get back to you within 1 hour</p>
        </section>

        <section class="enquiry-form">
            <form id="enquiryForm" novalidate>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                <span class="error-message"></span>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message"></span>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="0821234567" required>
                <span class="error-message"></span>

                <label for="service">Service Needed:</label>
                <select id="service" name="service" required>
                    <option value="">-- Choose a service --</option>
                    <option value="blocked-drain">Blocked Drain</option>
                    <option value="burst-pipe">Burst Pipe</option>
                    <option value="geyser">Geyser Installation/Repair</option>
                    <option value="toilet-sink">Toilet/Sink Installation</option>
                    <option value="sewer">Sewer Line Maintenance</option>
                    <option value="other">Other Plumbing Repair</option>
                </select>
                <span class="error-message"></span>

                <label for="message">Describe the Problem:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                <span class="error-message"></span>

                <button type="submit" class="btn">Submit Quote Request</button>
            </form>

            <div id="enquiryResponse" class="form-response" style="display:none;"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hitman Plumbing. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
